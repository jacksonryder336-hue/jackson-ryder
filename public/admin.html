<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Jackson Ryder</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <div class="login" id="loginView">
    <form class="login__card" id="loginForm">
      <img src="assets/logo.png" alt="Jackson Ryder" class="login__logo" />
      <h1>Admin Dashboard</h1>
      <p class="login__sub">Sign in to manage your website content.</p>
      <div class="field">
        <label>Username</label>
        <input type="text" id="loginUser" value="admin" autocomplete="username" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPass" autocomplete="current-password" placeholder="••••••••" />
      </div>
      <p class="login__note" id="loginNote" role="status"></p>
      <button type="submit" class="btn btn--primary btn--block" id="loginBtn">Sign In</button>
    </form>
  </div>

  <!-- ============ DASHBOARD ============ -->
  <div class="app" id="appView" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <img src="assets/logo.png" alt="logo" />
        <span>Jackson Ryder</span>
      </div>
      <nav class="sidebar__nav">
        <button data-view="dashboard" class="active">Dashboard</button>
        <button data-view="songs">Songs / Music</button>
        <button data-view="videos">Lyric Videos</button>
        <button data-view="songwriting">Songwriting</button>
        <button data-view="projects">Portfolio</button>
        <button data-view="enquiries">Enquiries <span class="badge" id="enqBadge" hidden>0</span></button>
        <button data-view="settings">Settings</button>
      </nav>
      <div class="sidebar__foot">
        <a href="/" target="_blank">View Website ↗</a>
        <button id="logoutBtn">Log out</button>
      </div>
    </aside>

    <main class="main">
      <div class="main__head">
        <h2 id="viewTitle">Dashboard</h2>
        <button class="btn btn--ghost" id="mobileMenuBtn">☰</button>
      </div>
      <div id="viewContent" class="main__content"></div>
    </main>
  </div>

  <!-- ============ MODAL ============ -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card">
      <div class="modal__head">
        <h3 id="modalTitle">Edit</h3>
        <button class="modal__close" data-close>&times;</button>
      </div>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="admin.js"></script>
</body>
</html>
